apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v2.14.11/manifests/install.yaml
patches:
- target: {kind: ConfigMap, name: argocd-cm}
  patch: |-
    - op: add
      path: /data
      value:
        timeout.reconciliation: 30s
        timeout.reconciliation.jitter: 0s
