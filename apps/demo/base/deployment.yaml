apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 2
  progressDeadlineSeconds: 90
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: demo
        image: python:3.12.12-slim-bookworm
        command: [python, -B, /app/app.py]
        env:
        - {name: APP_VERSION, value: v1}
        ports:
        - {name: http, containerPort: 8080}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - {name: code, mountPath: /app, readOnly: true}
      volumes:
      - name: code
        configMap: {name: demo-code}
