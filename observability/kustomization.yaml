apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources: [servicemonitors.yaml, alerts.yaml]
configMapGenerator:
- name: tp4-dashboard
  files: [tp4-gitops.json=dashboards/tp4-gitops.json]
  options:
    labels: {grafana_dashboard: '1'}
generatorOptions:
  disableNameSuffixHash: true
