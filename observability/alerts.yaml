apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tp4-alerts
  labels: {release: monitoring}
spec:
  groups:
  - name: tp4.gitops
    rules:
    - alert: ArgoCDApplicationDegraded
      expr: argocd_app_info{name="demo",health_status="Degraded"} == 1
      for: 2m
      labels: {severity: critical}
      annotations:
        summary: Application demo Degraded depuis plus de 2 minutes
        description: Verifier les pods puis corriger le manifeste dans Git.
    - alert: ArgoCDApplicationOutOfSync
      expr: argocd_app_info{name="demo",sync_status="OutOfSync"} == 1
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: Application demo OutOfSync depuis plus de 2 minutes
    - alert: DemoContainerBlocked
      expr: max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{namespace="demo",reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff"}) == 1
      for: 2m
      labels: {severity: critical}
      annotations:
        summary: 'Conteneur bloque : {{ $labels.pod }} / {{ $labels.reason }}'
