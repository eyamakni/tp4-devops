apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: observability, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/eyamakni/tp4-devops.git
    targetRevision: main
    path: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
