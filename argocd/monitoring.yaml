apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: monitoring, namespace: argocd}
spec:
  project: default
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 69.8.2
    helm:
      releaseName: monitoring
      valueFiles: [$values/monitoring/values.yaml]
  - repoURL: https://github.com/eyamakni/tp4-devops.git
    targetRevision: main
    ref: values
  destination: {server: 'https://kubernetes.default.svc', namespace: monitoring}
  ignoreDifferences:
  - group: ''
    kind: Secret
    name: monitoring-grafana
    namespace: monitoring
    jsonPointers: [/data/admin-password]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
